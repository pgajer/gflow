name: Documentation
on:
  workflow_run:
    workflows: [Package checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OMP_THREAD_LIMIT: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      RCPP_PARALLEL_NUM_THREADS: 1
      MAKEFLAGS: -j1
      MC_CORES: 1
      RGL_USE_NULL: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check public repository content
        run: python tools/check-public-content.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 1
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Create R library
        run: |
          mkdir -p "$RUNNER_TEMP/gflow-library"
          echo "R_LIBS_USER=$RUNNER_TEMP/gflow-library" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pkgdown
            any::roxygen2
            any::knitr
            any::rmarkdown
          dependencies: 'NA'
      - name: Install prepared sources with help and vignettes
        run: |
          make build-prepared R_ENV="env -u R_HOME"
          R CMD INSTALL gflow_*.tar.gz
          Rscript --vanilla tools/check_installed_guides.R
      - name: Build website from the installed package
        run: make website R_ENV="env -u R_HOME"
      - uses: actions/configure-pages@v5
      - name: Check rendered public content
        run: python tools/check-public-content.py --tree build/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
