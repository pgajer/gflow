name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ runner.temp }}/gflow-library
      OMP_NUM_THREADS: 1
      OMP_THREAD_LIMIT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Create R library
        run: mkdir -p "$R_LIBS_USER"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pkgdown
            any::roxygen2
            any::knitr
            any::rmarkdown
          dependencies: 'NA'
      - name: Install with generated help and vignettes
        run: make install-user
      - name: Build website from the installed package
        run: make website R_ENV="env -u R_HOME"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
