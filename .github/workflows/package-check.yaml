name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, r: '4.1.3', profile: cran-safe, serial: '1'}
          - {os: ubuntu-latest, r: release, profile: dev, serial: '0'}
          - {os: macos-latest, r: release, profile: cran-safe, serial: '1'}
          - {os: windows-latest, r: release, profile: dev, serial: '0'}
    env:
      GFLOW_BUILD_PROFILE: ${{ matrix.profile }}
      GFLOW_DISABLE_OPENMP: ${{ matrix.serial }}
      OMP_NUM_THREADS: 1
      OMP_THREAD_LIMIT: 1
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::roxygen2
            any::knitr
            any::rmarkdown
            any::testthat
          dependencies: 'NA'
      - name: Generate, build and audit
        run: |
          make build R_ENV="env -u R_HOME"
          make audit-api-guide audit-final-acceptance R_ENV="env -u R_HOME"
      - name: Check built package
        run: R CMD check --no-manual gflow_*.tar.gz
      - name: Check installed guides and execution mode
        run: |
          export R_LIBS="$PWD/gflow.Rcheck"
          Rscript --vanilla tools/check_installed_guides.R
          Rscript --vanilla tools/audit_api_guide.R --installed
          Rscript --vanilla tools/check_platform_contract.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: gflow.Rcheck
